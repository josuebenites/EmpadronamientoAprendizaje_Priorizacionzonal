# Tema del tablero. Fija el modo CLARO sin importar la configuracion del
# sistema operativo: sin este archivo, un equipo en modo oscuro renderiza el
# tablero con fondo negro y los colores de marca de IPA pierden contraste.
#
# Los valores son los colores oficiales de IPA.
#   IPA Green  #49ac57   color primario de marca
#   Light Gray #f1f2f2   fondos de paneles
#   Charcoal   #414042   texto

[theme]
base = "light"
primaryColor = "#49ac57"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f2f2"
textColor = "#414042"
font = "sans serif"

[browser]
gatherUsageStats = false
